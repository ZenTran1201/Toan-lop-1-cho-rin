    <script>
        /* ---------------- Global State & Data ---------------- */
        let currentLimit = 10;
        let totalStars = parseInt(localStorage.getItem('math_stars') || '0');
        let streak = 0;
        let currentMode = null; // 'count', 'math', 'compare', 'match', 'race'
        let soundEnabled = true;
        let currentAnswer = null;
        let playerName = localStorage.getItem('math_player_name') || '';

        // Racing game specific variables
        let raceScore = 0;
        const obstaclesIcons = ['🚧', '🪨', '📦', '⚠️', '🪵'];

        // Mascot Dialogues
        function getMascotDialogues() {
            const name = playerName || "bé";
            return {
                welcome: [`Chào ${name} yêu! Cùng gấu Barnaby học toán nhé! 🏎️`, `Hôm nay ${name} muốn thử sức với bài toán nào nè? ✨`],
                correct: [`Chính xác rồi! ${name} giỏi quá đi thôi! 🎉`, `Xuất sắc luôn! ${name} của gấu siêu thông minh! ⭐`, `Xe nổ bô vèo vèo! Thêm 1 ngôi sao cho ${name}! 🌟`],
                wrong: [`Cố lên ${name} ơi, thử tính lại một xíu nhé! 💪`, `Gần đúng rồi nè, ${name} xem lại kĩ nha! ❤️`, `Cố lên ${name} yêu! 🐻`],
                mascotClick: [`Hi hi, nhột gấu quá! ${name} tập trung làm toán nhé! 🐻`, `Gấu Barnaby luôn cổ vũ ${name} đó! Cố lên!`]
            };
        }

        /* ---------------- Display & UI Helper Functions ---------------- */
        function updateStarDisplay() {
            const starElem = document.getElementById('star-count');
            if (starElem) {
                starElem.innerText = totalStars;
            }
        }

        function renderBadges() {
            // Placeholder function for rendering badges if badge container exists
            const badgeContainer = document.getElementById('badge-container');
            if (badgeContainer) {
                badgeContainer.innerHTML = '';
                const badges = [
                    { icon: '⭐', minStars: 5, label: 'Ngôi Sao Tập Sự' },
                    { icon: '🚀', minStars: 20, label: 'Tay Đua Siêu Cấp' },
                    { icon: '👑', minStars: 50, label: 'Vua Toán Học' }
                ];
                badges.forEach(b => {
                    const unlocked = totalStars >= b.minStars;
                    const badgeEl = document.createElement('div');
                    badgeEl.className = `flex items-center space-x-1 px-3 py-1 rounded-full border text-xs font-bold ${unlocked ? 'bg-yellow-100 border-yellow-400 text-yellow-800' : 'bg-gray-100 border-gray-300 text-gray-400 opacity-60'}`;
                    badgeEl.innerHTML = `<span>${b.icon}</span><span>${b.label}</span>`;
                    badgeContainer.appendChild(badgeEl);
                });
            }
        }

        /* ---------------- Core App Initialization ---------------- */
        window.onload = function() {
            updateStarDisplay();
            renderBadges();
            setLimit(10);
            
            if (!playerName) {
                openNameModal();
            } else {
                updatePlayerNameUI();
            }
        };

        function openNameModal() {
            document.getElementById('name-modal').classList.remove('hidden');
            if (playerName) {
                document.getElementById('player-name-input').value = playerName;
            }
        }

        function savePlayerName() {
            playSound('click');
            const input = document.getElementById('player-name-input').value.trim();
            if (input) {
                playerName = input;
                localStorage.setItem('math_player_name', playerName);
                updatePlayerNameUI();
                document.getElementById('name-modal').classList.add('hidden');
                speakMascot(`Chào ${playerName}! Cùng gấu Barnaby bắt đầu học toán nhé! ⭐`);
            }
        }

        function updatePlayerNameUI() {
            const displayStr = playerName ? `Bé: ${playerName}` : 'Bé Học Toán';
            document.getElementById('player-greeting-header').innerText = displayStr;
        }

        function getRandomMascotText(type) {
            const dialogues = getMascotDialogues();
            const list = dialogues[type];
            return list[Math.floor(Math.random() * list.length)];
        }

        /* ---------------- PROGRESSIVE DIFFICULTY HELPER (2 TO 5 NUMBERS) ---------------- */
        function generateMathProblem() {
            // Determine number of elements in calculation based on streak
            let numTerms = 2;
            let levelLabel = "Mức 1 (2 số)";

            if (streak >= 12) {
                numTerms = 5;
                levelLabel = "Mức 4 (Cực khó: 5 số! 🔥)";
            } else if (streak >= 8) {
                numTerms = 4;
                levelLabel = "Mức 3 (Thử thách: 4 số! 🌟)";
            } else if (streak >= 4) {
                numTerms = 3;
                levelLabel = "Mức 2 (Nâng cao: 3 số ⭐)";
            }

            let terms = [];
            let ops = [];
            let currentVal = Math.floor(Math.random() * (currentLimit - 1)) + 1;
            terms.push(currentVal);

            for (let i = 1; i < numTerms; i++) {
                let isPlus = Math.random() > 0.45;
                let nextTerm = 1;

                if (isPlus) {
                    let maxAdd = currentLimit - currentVal;
                    if (maxAdd <= 1) {
                        isPlus = false;
                    } else {
                        nextTerm = Math.floor(Math.random() * Math.min(maxAdd, 6)) + 1;
                        currentVal += nextTerm;
                        ops.push('+');
                    }
                }

                if (!isPlus) {
                    if (currentVal <= 1) {
                        nextTerm = Math.floor(Math.random() * (currentLimit - currentVal)) + 1;
                        currentVal += nextTerm;
                        ops.push('+');
                    } else {
                        nextTerm = Math.floor(Math.random() * (currentVal - 1)) + 1;
                        currentVal -= nextTerm;
                        ops.push('-');
                    }
                }
                terms.push(nextTerm);
            }

            // Build expression text string
            let expr = `${terms[0]}`;
            for (let i = 0; i < ops.length; i++) {
                expr += ` ${ops[i]} ${terms[i+1]}`;
            }

            return { expressionText: expr, answer: currentVal, levelLabel: levelLabel, numTerms: numTerms };
        }

        /* ---------------- MODE 2: ADDITION & SUBTRACTION (PURE NUMBERS, NO VISUALS) ---------------- */
        function setupMathMode() {
            const display = document.getElementById('display-area');
            const options = document.getElementById('options-area');
            const titleTag = document.getElementById('game-title-tag');
            const prompt = document.getElementById('question-prompt');
            display.innerHTML = ''; options.innerHTML = '';

            titleTag.innerText = "Chế độ 2: Phép Cộng & Trừ";
            titleTag.className = "bg-blue-200 text-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide";
            prompt.innerText = "Bé hãy tính kết quả phép tính bên dưới nhé!";

            // Progressive math problem (2 to 5 numbers)
            const problem = generateMathProblem();
            currentAnswer = problem.answer;

            // Update level tag on UI
            const levelBadge = document.getElementById('level-badge');
            if (levelBadge) levelBadge.innerText = problem.levelLabel;

            // Display minimal pure number equation block (NO IMAGE HINTS)
            const container = document.createElement('div');
            container.className = "flex flex-col items-center justify-center p-6 md:p-8 bg-gradient-to-r from-blue-50 to-indigo-50 rounded-3xl border-3 border-blue-300 w-full max-w-lg shadow-md";

            const levelText = document.createElement('span');
            levelText.className = "text-xs font-bold text-indigo-600 bg-indigo-100 px-3 py-1 rounded-full mb-3";
            levelText.innerText = `Phép tính ${problem.numTerms} số`;

            const eqText = document.createElement('div');
            eqText.className = "text-3xl md:text-5xl font-extrabold text-blue-800 tracking-wider text-center leading-relaxed";
            eqText.innerText = `${problem.expressionText} = ?`;

            container.appendChild(levelText);
            container.appendChild(eqText);
            display.appendChild(container);

            // Large Touch Option Buttons optimized for Mobile
            const choices = generateChoices(currentAnswer, currentLimit);
            choices.forEach(val => {
                const btn = document.createElement('button');
                btn.className = "btn-3d bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white font-extrabold text-3xl md:text-4xl py-4 md:py-5 rounded-2xl border-2 border-blue-700 shadow-md";
                btn.innerText = val;
                btn.onclick = () => checkAnswer(val);
                options.appendChild(btn);
            });
        }
